name: Latest Medium Articles

on:
  schedule:
    # Runs every 6 hours so the profile always shows the latest posts
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-writers
  cancel-in-progress: false

jobs:
  update-readme-with-blog:
    name: Update this repo's README with latest blog posts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pull latest posts into README
        # Pinned to a commit SHA, not a tag: this step holds `contents: write`
        # and runs on a schedule with no human in the loop, and both @master and
        # a mutable @v1 tag can change under you. Dependabot bumps the pin.
        uses: gautamkrishnar/blog-post-workflow@f177491c77670f150ab4e9b9890254d8eba4164b # v1
        with:
          max_post_count: "8"
          feed_list: "https://medium.com/feed/@santosh-shinde"
          commit_message: "chore: update README with latest blog posts"
          # Medium appends a ?source=rss-… tracking parameter to every link.
          # `post.url` is the documented item_exec handle; stripping it here
          # keeps the README clean permanently instead of by hand each time.
          item_exec: "post.url = post.url.split('?')[0]"
          # Built-in dummy commit after 50 quiet days, guarding the 60-day
          # dormancy auto-disable that stopped this cron after 2025-12-26.
          # Default is already true; pinned explicitly so it can't regress.
          enable_keepalive: "true"
